<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdelhamid Tahar | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .code-font { font-family: 'Fira Code', monospace; }
        .gradient-text {
            background: linear-gradient(90deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 leading-relaxed scroll-smooth">

    <!-- ===================== HERO (Code 1 + Code 2 buttons) ===================== -->
    <header class="min-h-screen flex items-center justify-center text-center px-4">
        <div class="max-w-3xl">
            <h1 class="text-5xl md:text-7xl font-black mb-4">
                Hello, I'm <span class="gradient-text" id="hero-name"></span>
            </h1>
            <p class="text-xl md:text-2xl text-gray-400 mb-8 code-font" id="hero-role"></p>

            <!-- Code 1 button -->
            <a href="#about"
               class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-full transition duration-300 shadow-lg shadow-blue-500/30 mr-3 mb-3 inline-block">
                View My Work
            </a>

            <!-- Code 2 buttons -->
            <a href="#projects"
               class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-8 rounded-full transition duration-300 shadow-lg shadow-emerald-500/30 mr-3 mb-3 inline-block">
                View Projects
            </a>
            <a href="#certificates"
               class="bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-8 rounded-full transition duration-300 shadow-lg shadow-gray-700/30 mb-3 inline-block">
                View Certificates
            </a>
        </div>
    </header>

    <!-- ===================== ABOUT ME (Code 1) ===================== -->
    <section class="py-20 bg-gray-800" id="about">
        <div class="max-w-6xl mx-auto px-4 grid md:grid-cols-2 gap-12 items-center">
            <div>
                <h2 class="text-4xl font-bold mb-6 border-l-4 border-blue-500 pl-4">About Me</h2>
                <p class="text-lg text-gray-300 mb-4 leading-relaxed" id="about-bio"></p>
            </div>
            <div class="bg-gray-900 p-8 rounded-2xl shadow-xl">
                <h3 class="text-2xl font-bold mb-6 text-center">Technical Skills</h3>
                <div class="flex flex-wrap gap-3 justify-center" id="skills-container"></div>
            </div>
        </div>
    </section>

    <!-- ===================== PROJECTS (Code 2) ===================== -->
    <section class="py-20" id="projects">
        <div class="max-w-6xl mx-auto px-4">
            <h2 class="text-4xl font-bold mb-12 text-center">Featured Projects</h2>
            <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8" id="projects-container"></div>
        </div>
    </section>

    <!-- ===================== CERTIFICATES (Code 2) ===================== -->
    <section class="py-20 bg-gray-800" id="certificates">
        <div class="max-w-6xl mx-auto px-4">
            <h2 class="text-4xl font-bold mb-12 text-center">Certifications</h2>
            <div class="grid md:grid-cols-3 gap-6" id="certificates-container"></div>
        </div>
    </section>

    <footer class="py-12 bg-gray-900 border-t border-gray-800 text-center">
        <p class="text-gray-500 text-sm">© 2026 Developed by Abdelhamid Tahar.</p>
    </footer>

    <script>
        // DATA
        const portfolioData = {
            name: "Abdelhamid Tahar",
            role: "Software Developer | CS & Cybersecurity",
            bio: "I am a passionate Software Developer with a strong foundation in Computer Science and Databases. I believe that 'Anything that doesn't make people's lives easier has no real value.' I specialize in low-level programming (C++), building robust backend systems, and solving complex algorithmic challenges.",
            skills: ["C++", "C", "Delphi", "Oracle DB", "SQL", "Cybersecurity", "Algorithms", "Git", "Visual Studio", "PHP"],
            projects: [
                { title: "Library System",     desc: "Digital management system for school libraries using Delphi & Oracle DB.", tech: "Delphi, Oracle" },
                { title: "Nutrition Tracker",  desc: "Server-side integration with smart scales for weight and nutrition monitoring.", tech: "API, Backend" },
                { title: "Bank System",        desc: "High-level system architecture using C++ focusing on edge cases and Clean Code.", tech: "C++, OOP" }
            ],
            certs: [
                { name: "CS Databases Diploma", issuer: "INSFP Tebessa", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSfqjr9-vcMid-RDrcSypln0MY6Ecwg8IHJjIbV104dHw&s" },
                { name: "Algorithms Level 4",   issuer: "Programming Advices" },
                { name: "C++ Level 2",          issuer: "Programming Advices" }
            ]
        };

        // RENDER
        document.getElementById('hero-name').innerText  = portfolioData.name;
        document.getElementById('hero-role').innerText  = portfolioData.role;
        document.getElementById('about-bio').innerText  = portfolioData.bio;

        const skillsContainer = document.getElementById('skills-container');
        portfolioData.skills.forEach(skill => {
            skillsContainer.innerHTML += `<span class="bg-blue-900/30 text-blue-300 px-3 py-1 rounded-full text-sm border border-blue-700">${skill}</span>`;
        });

        const projContainer = document.getElementById('projects-container');
        portfolioData.projects.forEach(p => {
            projContainer.innerHTML += `
                <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 hover:border-blue-500 transition">
                    <h3 class="text-xl font-bold mb-2 text-white">${p.title}</h3>
                    <p class="text-gray-400 mb-4 text-sm">${p.desc}</p>
                    <span class="text-xs bg-gray-900 px-2 py-1 rounded text-blue-400">${p.tech}</span>
                </div>`;
        });

        const certContainer = document.getElementById('certificates-container');
        portfolioData.certs.forEach(c => {
            certContainer.innerHTML += `
                <div class="bg-gray-900 p-6 rounded-xl border border-gray-700 text-center">
                    <h4 class="font-bold text-white mb-1">${c.name}</h4>
                    <p class="text-sm text-gray-500">${c.issuer}</p>
                </div>`;
        });
    </script>
</body>
</html>
